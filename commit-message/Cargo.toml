[package]
name = "commit-message"
version = "0.1.0"
edition = "2024"
description = "Prefills a commit message with a summary of what is staged. Runs as a global prepare-commit-msg hook."

# The hook has to be found by git under its own name so the built binary is
# named for the hook rather than for the crate.
[[bin]]
name = "prepare-commit-msg"
path = "src/main.rs"

# One local path and nothing from a registry. The estimate model stays beside
# the research that sets its constants rather than being copied here. Because a)
# the crate links statically so startup is still a single exec b) the tree still
# builds offline years from now and c) nothing here can rot the rule that kept
# this hook free of registry dependencies still holds.
[dependencies]
review-time = { path = "../code_reviewing/review-time" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
