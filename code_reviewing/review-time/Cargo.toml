[package]
name = "review-time"
version = "0.1.0"
edition = "2021"
description = "Approximate how long a code review will take from the diff"

[lib]
name = "review_time"
path = "src/lib.rs"

[[bin]]
name = "review-time"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
