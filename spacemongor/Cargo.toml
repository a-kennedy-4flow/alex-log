[package]
name = "spacemongor"
version = "0.1.0"
edition = "2024"
description = "Read only disk treemap. Select a mounted filesystem and watch it fill in as the scan runs."

[dependencies]
eframe = "0.36"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
