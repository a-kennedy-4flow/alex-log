---
# Design B: Group Replication with a single primary.
# Three members form a group and agree writes by consensus.
# Two of three is a quorum so the group survives losing one member.
# One member accepts writes. The group elects a replacement when it fails.
#
# Terms used here:
#   member        a mysqld instance that belongs to the group
#   primary       the member that accepts writes
#   quorum        the majority of members needed to agree a write
#   recovery      the process a joining member uses to fetch transactions it missed

- name: Define the single primary settings
  ansible.builtin.set_fact:
    mysql_sp_image: "{{ mysql_sp_image | default('mysql:8.4') }}"
    mysql_sp_network: "{{ mysql_sp_network | default('mysql-sp') }}"
    mysql_sp_group_name: "{{ mysql_sp_group_name | default('11111111-1111-1111-1111-111111111111') }}"
    mysql_sp_root_password: "{{ mysql_sp_root_password | default('password') }}"
    mysql_sp_recovery_user: "{{ mysql_sp_recovery_user | default('repl') }}"
    mysql_sp_recovery_password: "{{ mysql_sp_recovery_password | default('replication') }}"
    mysql_sp_reset_local_gtids: "{{ mysql_sp_reset_local_gtids | default(true) | bool }}"
    mysql_sp_nodes: "{{ mysql_sp_nodes | default(mysql_sp_default_nodes) }}"
  vars:
    mysql_sp_default_nodes:
      - name: mysql-sp-1
        server_id: 1
        host_port: 3316
      - name: mysql-sp-2
        server_id: 2
        host_port: 3317
      - name: mysql-sp-3
        server_id: 3
        host_port: 3318

- name: Define the group seeds
  ansible.builtin.set_fact:
    mysql_sp_seeds: "{{ mysql_sp_nodes | map(attribute='name') | product([':33061']) | map('join') | join(',') }}"

- name: Create the group network
  community.docker.docker_network:
    name: "{{ mysql_sp_network }}"
    driver: bridge
    state: present

- name: Create a data volume per member
  community.docker.docker_volume:
    name: "{{ item.name }}-data"
    state: present
  loop: "{{ mysql_sp_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start a MySQL container per member
  community.docker.docker_container:
    name: "{{ item.name }}"
    image: "{{ mysql_sp_image }}"
    state: started
    restart_policy: unless-stopped
    hostname: "{{ item.name }}"
    networks:
      - name: "{{ mysql_sp_network }}"
    networks_cli_compatible: true
    ports:
      # Publish container port 3306 as the host port for this member
      - "{{ item.host_port }}:3306"
    volumes:
      - "{{ item.name }}-data:/var/lib/mysql"
    env:
      MYSQL_ROOT_PASSWORD: "{{ mysql_sp_root_password }}"
    command:
      - "--server-id={{ item.server_id }}"
      - "--report-host={{ item.name }}"
      - "--report-port=3306"
      - "--log-bin=binlog"
      - "--log-replica-updates=ON"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--relay-log=relaylog"
      - "--plugin-load-add=group_replication.so"
      # The loose prefix keeps mysqld from refusing to start before the plugin loads
      - "--loose-group-replication-group-name={{ mysql_sp_group_name }}"
      - "--loose-group-replication-local-address={{ item.name }}:33061"
      - "--loose-group-replication-group-seeds={{ mysql_sp_seeds }}"
      - "--loose-group-replication-start-on-boot=OFF"
      - "--loose-group-replication-bootstrap-group=OFF"
      - "--loose-group-replication-recovery-get-public-key=ON"
      - "--loose-group-replication-exit-state-action=READ_ONLY"
      # This pair is what makes the design single primary
      - "--loose-group-replication-single-primary-mode=ON"
      - "--loose-group-replication-enforce-update-everywhere-checks=OFF"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  loop: "{{ mysql_sp_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for each member to report healthy
  community.docker.docker_container_info:
    name: "{{ item.name }}"
  register: mysql_sp_health
  until: mysql_sp_health.container.State.Health.Status | default('starting') == 'healthy'
  retries: 30
  delay: 5
  loop: "{{ mysql_sp_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Prepare each member for the group
  ansible.builtin.include_tasks: prepare_member.yml
  loop: "{{ mysql_sp_nodes }}"
  loop_control:
    loop_var: member
    label: "{{ member.name }}"

- name: Read the group view from each member
  community.docker.docker_container_exec:
    container: "{{ item.name }}"
    argv:
      - mysql
      - -uroot
      - --skip-column-names
      - --batch
      - -e
      - >-
        SELECT COUNT(*) FROM performance_schema.replication_group_members
        WHERE member_state = 'ONLINE'
    env:
      MYSQL_PWD: "{{ mysql_sp_root_password }}"
  register: mysql_sp_views
  changed_when: false
  loop: "{{ mysql_sp_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Decide whether the group needs bootstrapping
  ansible.builtin.set_fact:
    # Bootstrap only when no member anywhere reports an online peer.
    # Bootstrapping a live group would split the brain.
    mysql_sp_needs_bootstrap: >-
      {{ mysql_sp_views.results | map(attribute='stdout') | map('trim') | map('int') | sum == 0 }}

- name: Bootstrap the group on the first member
  community.docker.docker_container_exec:
    container: "{{ mysql_sp_nodes | map(attribute='name') | first }}"
    argv:
      - mysql
      - -uroot
      - -e
      - >-
        SET GLOBAL group_replication_bootstrap_group = ON;
        START GROUP_REPLICATION;
        SET GLOBAL group_replication_bootstrap_group = OFF;
    env:
      MYSQL_PWD: "{{ mysql_sp_root_password }}"
  when: mysql_sp_needs_bootstrap | bool

- name: Join every member that is not already online
  ansible.builtin.include_tasks: join_member.yml
  loop: "{{ mysql_sp_nodes }}"
  loop_control:
    loop_var: member
    label: "{{ member.name }}"

- name: Read the final group membership
  community.docker.docker_container_exec:
    container: "{{ mysql_sp_nodes | map(attribute='name') | first }}"
    argv:
      - mysql
      - -uroot
      - --table
      - -e
      - >-
        SELECT member_host, member_port, member_state, member_role
        FROM performance_schema.replication_group_members ORDER BY member_host
    env:
      MYSQL_PWD: "{{ mysql_sp_root_password }}"
  register: mysql_sp_membership
  changed_when: false
  until: mysql_sp_membership.stdout | regex_findall('ONLINE') | length == mysql_sp_nodes | length
  retries: 24
  delay: 5

- name: Report the group state
  ansible.builtin.debug:
    msg: "{{ [mysql_sp_summary] + mysql_sp_membership.stdout.split('\n') }}"
  vars:
    mysql_sp_summary: >-
      Design B single primary on network {{ mysql_sp_network }} with host ports
      {{ mysql_sp_nodes | map(attribute='host_port') | join(' ') }}.
      Only the primary accepts writes and the group elects a replacement on failure.
