---
# Remove every demo stack so the next experiment starts from nothing.
# This matters between designs. A volume carrying the old GTID history or the
# old group settings will refuse to rejoin a group configured differently.

- name: Define the stacks to remove
  ansible.builtin.set_fact:
    mysql_teardown_stacks: "{{ mysql_teardown_stacks | default(mysql_teardown_default_stacks) }}"
    mysql_teardown_config_root: "{{ mysql_teardown_config_root | default('/var/tmp/mysql-demo') }}"
  vars:
    mysql_teardown_default_stacks:
      - network: mysql-async
        nodes: [mysql-async-1, mysql-async-2, mysql-async-3]
        extras: [pmm-client-async]
      - network: mysql-sp
        nodes: [mysql-sp-1, mysql-sp-2, mysql-sp-3]
        extras: [proxysql-sp, orchestrator-sp, pmm-client-sp]
      - network: mysql-mp
        nodes: [mysql-mp-1, mysql-mp-2, mysql-mp-3]
        extras: [proxysql-mp, orchestrator-mp, pmm-client-mp]

# The routers and the observers and the PMM clients come first. A network cannot
# go while anything is still attached to it. The PMM server is left running
# because it is standalone. Remove it with the pmm-teardown tag.
- name: Remove the routers and the observers and the clients
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
    keep_volumes: false
  loop: "{{ mysql_teardown_stacks | map(attribute='extras') | flatten }}"

- name: Remove the MySQL containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  loop: "{{ mysql_teardown_stacks | map(attribute='nodes') | flatten }}"

- name: Remove the data volumes
  community.docker.docker_volume:
    name: "{{ item }}-data"
    state: absent
  loop: "{{ mysql_teardown_stacks | map(attribute='nodes') | flatten }}"

- name: Remove the networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: absent
  loop: "{{ mysql_teardown_stacks | map(attribute='network') | list }}"

- name: Remove the rendered router configuration
  ansible.builtin.file:
    path: "{{ mysql_teardown_config_root }}"
    state: absent
