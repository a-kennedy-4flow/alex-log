# Which repos get a pre-commit gate and what runs in each.
#
# profile <name> marker <file>   the file that marks the root of one project
# profile <name> <command>       one command per line. They run in order.
# repo <path> <name>             a path closing in /* covers everything under it
#
# A repo that is not listed here runs nothing and the commit goes straight
# through. With a marker the commands run once in each project holding a staged
# change rather than once at the root. Run `pre-commit --list` inside a repo to
# see what applies to it.

profile rust marker Cargo.toml
profile rust cargo clippy --all-targets -- -D warnings
profile rust cargo test --all-targets

# No crate here is rustfmt clean today. commit-message alone wants 44 changes.
# Uncomment once you have run cargo fmt over the crates you want held to it.
# profile rust cargo fmt --all --check

repo /home/alex/repos/alex-log rust
repo /home/alex/repos/alex-log.worktrees/* rust

# The gradle gate that used to fire in every repo. Uncomment a line to bring it
# back for that repo alone. The polaris script with its terraform and squawk
# steps is kept beside this file as pre-commit.polaris-template.
profile gradle ./gradlew spotlessCheck spotbugsMain pmdMain javadoc --continue -PenforceCodeQuality

